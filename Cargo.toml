[package]
name = "pg-qbz"
description = "Qobuz catalogue with Firefox authentication and playback"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
qobuz-api = { path = "crates/qobuz-api" }
qobuz-models = { path = "crates/qobuz-models" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query"] }
regex = "1"
html-escape = "=0.2.13"
base64 = "0.23"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[workspace]
members = ["crates/qobuz-api", "crates/qobuz-models", "crates/media-core"]
resolver = "2"
