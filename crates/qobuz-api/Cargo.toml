[package]
name = "qobuz-api"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
[dependencies]
qobuz-models = { path = "../qobuz-models" }
media-core = { path = "../media-core" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
base64 = "0.23"
zeroize = "1"
chrono = "0.4"
regex = "1"
log = "0.4"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
